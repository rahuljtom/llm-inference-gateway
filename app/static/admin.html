<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LLM Gateway — Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <style>
    :root { font-family: system-ui, sans-serif; background: #0f1117; color: #e6edf3; }
    body { margin: 0; padding: 2rem; max-width: 1100px; margin-inline: auto; }
    h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
    .sub { color: #8b949e; margin-bottom: 2rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1rem; }
    .card .label { font-size: 0.75rem; color: #8b949e; text-transform: uppercase; }
    .card .value { font-size: 1.75rem; font-weight: 600; margin-top: 0.25rem; }
    canvas { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1rem; margin-bottom: 1.5rem; }
  </style>
</head>
<body>
  <h1>LLM Inference Gateway</h1>
  <p class="sub">Last 24 hours — loaded from Postgres</p>

  <div class="grid" id="kpis"></div>
  <canvas id="hourlyChart" height="100"></canvas>
  <canvas id="providerChart" height="100"></canvas>

  <script>
    let hourlyChart, providerChart;

    function kpi(label, value) {
      return `<div class="card"><div class="label">${label}</div><div class="value">${value}</div></div>`;
    }

    async function load() {
      const res = await fetch('/admin/api/stats');
      const data = await res.json();

      document.getElementById('kpis').innerHTML = [
        kpi('Requests', data.total_requests),
        kpi('Tokens', data.total_tokens.toLocaleString()),
        kpi('Avg latency', data.avg_latency_ms + ' ms'),
        kpi('Cache hit rate', (data.cache_hit_rate * 100).toFixed(1) + '%'),
        kpi('Fallback rate', (data.fallback_rate * 100).toFixed(1) + '%'),
      ].join('');

      const hourlyLabels = data.hourly_requests.map((h) => h.hour ? new Date(h.hour).toLocaleTimeString() : '');
      const hourlyValues = data.hourly_requests.map((h) => h.requests);

      if (hourlyChart) hourlyChart.destroy();
      hourlyChart = new Chart(document.getElementById('hourlyChart'), {
        type: 'line',
        data: {
          labels: hourlyLabels,
          datasets: [{ label: 'Requests / hour', data: hourlyValues, borderColor: '#58a6ff', tension: 0.3 }],
        },
        options: { plugins: { legend: { labels: { color: '#e6edf3' } } }, scales: { x: { ticks: { color: '#8b949e' } }, y: { ticks: { color: '#8b949e' } } } },
      });

      const providers = data.by_provider.map((p) => p.provider);
      const providerCounts = data.by_provider.map((p) => p.requests);

      if (providerChart) providerChart.destroy();
      providerChart = new Chart(document.getElementById('providerChart'), {
        type: 'bar',
        data: {
          labels: providers,
          datasets: [{ label: 'Requests by provider', data: providerCounts, backgroundColor: '#3fb950' }],
        },
        options: { plugins: { legend: { labels: { color: '#e6edf3' } } }, scales: { x: { ticks: { color: '#8b949e' } }, y: { ticks: { color: '#8b949e' } } } },
      });
    }

    load();
    setInterval(load, 30000);
  </script>
</body>
</html>
