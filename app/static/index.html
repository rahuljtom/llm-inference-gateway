<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Inference Control Plane</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        background: '#09090b',
                        surface: '#18181b',
                        surfaceHover: '#27272a',
                        border: '#27272a',
                        primary: '#3b82f6',
                        success: '#22c55e',
                        warning: '#eab308',
                        danger: '#ef4444'
                    },
                    fontFamily: {
                        mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Markdown & Highlighting -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <!-- Recharts -->
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>

    <style>
        body {
            background-color: #09090b;
            color: #f4f4f5;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        
        .glass-panel {
            background: rgba(24, 24, 27, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(39, 39, 42, 0.8);
        }

        .markdown-body pre {
            background: #000;
            padding: 1rem;
            border-radius: 0.5rem;
            border: 1px solid #27272a;
            overflow-x: auto;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .markdown-body code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
        }

        .markdown-body p {
            margin-bottom: 0.75rem;
            line-height: 1.6;
        }

        /* Flow Diagram Animations */
        @keyframes flowPulse {
            0% { opacity: 0.2; }
            50% { opacity: 1; filter: drop-shadow(0 0 8px currentColor); }
            100% { opacity: 0.2; }
        }
        .anim-flow {
            animation: flowPulse 1.5s infinite;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #3f3f46;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #52525b;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { LineChart, Line, XAxis, YAxis, Tooltip, ResponsiveContainer, BarChart, Bar } = window.Recharts;

        // Custom hook for Lucide Icons
        const Icon = ({ name, className = "", size = 24 }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current && window.lucide) {
                    window.lucide.createIcons({
                        icons: { [name]: window.lucide.icons[name] },
                        nameAttr: 'data-lucide',
                        root: iconRef.current
                    });
                }
            }, [name]);
            return <span ref={iconRef}><i data-lucide={name} className={className} style={{ width: size, height: size }}></i></span>;
        };

        marked.setOptions({
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    return hljs.highlight(code, { language: lang }).value;
                }
                return hljs.highlightAuto(code).value;
            }
        });

        const App = () => {
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState("");
            const [isStreaming, setIsStreaming] = useState(false);
            const [config, setConfig] = useState({
                primaryProvider: "fast-chat",
                fallbackProvider: "gemini-chat",
                routingMode: "auto",
                apiKey: ""
            });
            const [metrics, setMetrics] = useState({
                latencyHistory: Array(10).fill({ time: '', ms: 0 }),
                avgLatency: 0,
                requestCount: 0,
                dbStatus: 'ok',
                redisStatus: 'ok'
            });
            const [activeFlow, setActiveFlow] = useState(null);
            const messagesEndRef = useRef(null);

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
            };

            useEffect(() => {
                scrollToBottom();
            }, [messages]);

            const handleSend = async () => {
                if (!input.trim() || isStreaming) return;
                
                const userMsg = { role: 'user', content: input, timestamp: new Date().toISOString() };
                setMessages(prev => [...prev, userMsg]);
                setInput("");
                setIsStreaming(true);
                setActiveFlow('sending');

                const startTime = Date.now();
                let aiMsg = { role: 'assistant', content: '', timestamp: new Date().toISOString(), tokens: 0, duration: 0, provider: '' };
                setMessages(prev => [...prev, aiMsg]);

                try {
                    const headers = {
                        "Content-Type": "application/json"
                    };
                    
                    if (config.apiKey) headers["X-Provider-Api-Key"] = config.apiKey;
                    if (config.routingMode === 'manual') headers["X-Provider"] = config.primaryProvider.split('-')[0];
                    
                    if (config.fallbackProvider && config.routingMode === 'auto') {
                        headers["X-Gateway-Fallback"] = config.fallbackProvider.split('-')[0];
                    }

                    const response = await fetch('/v1/chat/completions', {
                        method: 'POST',
                        headers,
                        body: JSON.stringify({
                            model: config.primaryProvider,
                            messages: [...messages, userMsg].map(m => ({ role: m.role, content: m.content })),
                            stream: true
                        })
                    });

                    if (!response.ok) {
                        const errText = await response.text();
                        throw new Error(errText || `HTTP ${response.status}`);
                    }

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder("utf-8");
                    setActiveFlow('streaming');

                    let tokenCount = 0;
                    let contentBuffer = '';

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        const chunk = decoder.decode(value, { stream: true });
                        const lines = chunk.split('\n');

                        for (const line of lines) {
                            if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                                try {
                                    const parsed = JSON.parse(line.slice(6));
                                    
                                    if (parsed.error) {
                                        contentBuffer += `\n\n> **[System Error]:** ${parsed.error}`;
                                    }

                                    if (parsed.choices && parsed.choices[0]?.delta?.content) {
                                        contentBuffer += parsed.choices[0].delta.content;
                                        tokenCount++;
                                    }
                                    
                                    if (parsed.model) {
                                        aiMsg.provider = parsed.model;
                                    }

                                    setMessages(prev => {
                                        const newMsgs = [...prev];
                                        newMsgs[newMsgs.length - 1] = {
                                            ...aiMsg,
                                            content: contentBuffer,
                                            tokens: tokenCount,
                                            duration: Date.now() - startTime
                                        };
                                        return newMsgs;
                                    });
                                } catch (e) {
                                    // Ignore partial JSON
                                }
                            }
                        }
                    }
                    
                    const finalDuration = Date.now() - startTime;
                    setMetrics(prev => ({
                        ...prev,
                        requestCount: prev.requestCount + 1,
                        avgLatency: Math.floor((prev.avgLatency * prev.requestCount + finalDuration) / (prev.requestCount + 1)),
                        latencyHistory: [...prev.latencyHistory.slice(1), { time: new Date().toLocaleTimeString(), ms: finalDuration }]
                    }));

                } catch (err) {
                    setMessages(prev => {
                        const newMsgs = [...prev];
                        newMsgs[newMsgs.length - 1].content = `> **[Gateway Error]:** ${err.message}`;
                        return newMsgs;
                    });
                } finally {
                    setIsStreaming(false);
                    setActiveFlow(null);
                }
            };

            const FlowNode = ({ label, active }) => (
                <div className={`flex flex-col items-center justify-center p-2 rounded border ${active ? 'border-primary bg-primary/20 text-primary anim-flow' : 'border-border bg-surface text-gray-400'}`}>
                    <span className="text-xs font-mono font-medium">{label}</span>
                </div>
            );

            return (
                <div className="flex h-screen w-full font-sans">
                    {/* LEFT SIDEBAR - CONFIG */}
                    <aside className="w-64 glass-panel border-r flex flex-col p-4 space-y-6 shrink-0 z-10">
                        <div>
                            <h2 className="text-sm font-semibold tracking-wider text-gray-400 uppercase mb-4 flex items-center gap-2">
                                <Icon name="settings" size={16} /> Routing Config
                            </h2>
                            
                            <div className="space-y-4">
                                <div>
                                    <label className="text-xs text-gray-500 font-mono mb-1 block">ROUTING_MODE</label>
                                    <select 
                                        value={config.routingMode} 
                                        onChange={e => setConfig({...config, routingMode: e.target.value})}
                                        className="w-full bg-black border border-border rounded p-2 text-sm text-gray-200 outline-none focus:border-primary"
                                    >
                                        <option value="auto">Auto (Managed)</option>
                                        <option value="manual">Manual Override</option>
                                    </select>
                                </div>

                                <div>
                                    <label className="text-xs text-gray-500 font-mono mb-1 block">PRIMARY_ENDPOINT</label>
                                    <select 
                                        value={config.primaryProvider} 
                                        onChange={e => setConfig({...config, primaryProvider: e.target.value})}
                                        className="w-full bg-black border border-border rounded p-2 text-sm text-gray-200 outline-none focus:border-primary"
                                    >
                                        <option value="fast-chat">Groq (Llama 3)</option>
                                        <option value="gemini-chat">Gemini (1.5 Flash)</option>
                                        <option value="smart-chat">OpenAI (GPT-4o)</option>
                                        <option value="claude-chat">Anthropic (Claude 3.5)</option>
                                    </select>
                                </div>

                                {config.routingMode === 'auto' && (
                                    <div>
                                        <label className="text-xs text-gray-500 font-mono mb-1 block">FALLBACK_ENDPOINT</label>
                                        <select 
                                            value={config.fallbackProvider} 
                                            onChange={e => setConfig({...config, fallbackProvider: e.target.value})}
                                            className="w-full bg-black border border-border rounded p-2 text-sm text-gray-200 outline-none focus:border-primary"
                                        >
                                            <option value="">None</option>
                                            <option value="gemini-chat">Gemini (1.5 Flash)</option>
                                            <option value="smart-chat">OpenAI (GPT-4o)</option>
                                            <option value="fast-chat">Groq (Llama 3)</option>
                                        </select>
                                    </div>
                                )}

                                <div>
                                    <label className="text-xs text-gray-500 font-mono mb-1 block">UPSTREAM_API_KEY (BYOK)</label>
                                    <input 
                                        type="password" 
                                        placeholder="Optional override..."
                                        value={config.apiKey}
                                        onChange={e => setConfig({...config, apiKey: e.target.value})}
                                        className="w-full bg-black border border-border rounded p-2 text-sm text-gray-200 outline-none focus:border-primary font-mono placeholder:text-gray-700"
                                    />
                                </div>
                            </div>
                        </div>

                        <div className="mt-auto pt-4 border-t border-border">
                            <div className="text-xs text-gray-500 font-mono flex items-center justify-between">
                                <span>Version</span>
                                <span>v2.1.0</span>
                            </div>
                        </div>
                    </aside>

                    {/* CENTER - MAIN VIEW */}
                    <main className="flex-1 flex flex-col min-w-0 bg-background relative z-0">
                        {/* TOP STATUS BAR */}
                        <header className="h-14 glass-panel border-b flex items-center justify-between px-6 shrink-0">
                            <div className="flex items-center gap-6">
                                <div className="flex items-center gap-2">
                                    <div className="w-2 h-2 rounded-full bg-success"></div>
                                    <span className="text-sm font-mono text-gray-300">Gateway API Online</span>
                                </div>
                                <div className="h-4 w-px bg-border"></div>
                                <div className="flex items-center gap-4 text-xs font-mono text-gray-500">
                                    <span className="flex items-center gap-1"><Icon name="database" size={14}/> DB: OK</span>
                                    <span className="flex items-center gap-1"><Icon name="server" size={14}/> Redis: OK</span>
                                </div>
                            </div>
                            <div className="flex items-center gap-6 text-xs font-mono text-gray-400">
                                <span>REQ: <span className="text-gray-200">{metrics.requestCount}</span></span>
                                <span>AVG LATENCY: <span className="text-gray-200">{metrics.avgLatency}ms</span></span>
                            </div>
                        </header>

                        {/* CHAT AREA */}
                        <div className="flex-1 overflow-y-auto p-6 space-y-6">
                            {messages.length === 0 && (
                                <div className="h-full flex flex-col items-center justify-center text-gray-500 space-y-4">
                                    <Icon name="terminal" size={48} className="opacity-20" />
                                    <p className="font-mono text-sm">Waiting for incoming requests...</p>
                                </div>
                            )}
                            
                            {messages.map((msg, i) => (
                                <div key={i} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                    <div className={`max-w-3xl w-full rounded-lg p-4 ${
                                        msg.role === 'user' 
                                            ? 'bg-primary/10 border border-primary/20 text-blue-50' 
                                            : 'glass-panel text-gray-200'
                                    }`}>
                                        <div className="flex items-center justify-between mb-2 text-xs font-mono opacity-50">
                                            <span>{msg.role === 'user' ? 'Client Request' : 'Provider Response'}</span>
                                            {msg.role === 'assistant' && msg.duration > 0 && (
                                                <div className="flex gap-4">
                                                    <span>{msg.provider || 'router'}</span>
                                                    <span>{msg.duration}ms</span>
                                                    <span>{msg.tokens} tk</span>
                                                    <span>{(msg.tokens / (msg.duration/1000)).toFixed(1)} tk/s</span>
                                                </div>
                                            )}
                                        </div>
                                        <div 
                                            className="markdown-body text-sm"
                                            dangerouslySetInnerHTML={{ __html: marked.parse(msg.content || (isStreaming && msg.role === 'assistant' ? '...' : '')) }}
                                        />
                                    </div>
                                </div>
                            ))}
                            <div ref={messagesEndRef} />
                        </div>

                        {/* INPUT AREA */}
                        <div className="p-4 border-t border-border glass-panel shrink-0">
                            <div className="max-w-4xl mx-auto flex gap-4">
                                <input 
                                    type="text" 
                                    value={input}
                                    onChange={e => setInput(e.target.value)}
                                    onKeyDown={e => e.key === 'Enter' && handleSend()}
                                    placeholder="Enter prompt to dispatch through gateway..."
                                    className="flex-1 bg-black border border-border rounded-lg px-4 py-3 text-sm text-gray-100 outline-none focus:border-primary font-mono placeholder:text-gray-600 transition-colors"
                                />
                                <button 
                                    onClick={handleSend}
                                    disabled={isStreaming || !input.trim()}
                                    className="bg-primary hover:bg-blue-600 disabled:opacity-50 disabled:hover:bg-primary text-white rounded-lg px-6 py-3 font-semibold transition-colors flex items-center gap-2"
                                >
                                    <Icon name="send" size={18} />
                                    Dispatch
                                </button>
                            </div>
                        </div>
                    </main>

                    {/* RIGHT SIDEBAR - OBSERVABILITY */}
                    <aside className="w-80 glass-panel border-l flex flex-col overflow-y-auto shrink-0 z-10">
                        <div className="p-4 border-b border-border">
                            <h2 className="text-sm font-semibold tracking-wider text-gray-400 uppercase flex items-center gap-2">
                                <Icon name="activity" size={16} /> Observability
                            </h2>
                        </div>
                        
                        <div className="p-4 space-y-8">
                            {/* Infra Flow */}
                            <div>
                                <h3 className="text-xs font-mono text-gray-500 mb-3">REQUEST PIPELINE</h3>
                                <div className="flex justify-between items-center bg-black/50 rounded-lg p-4 border border-border">
                                    <FlowNode label="CLIENT" active={activeFlow === 'sending'} />
                                    <Icon name="arrow-right" size={14} className="text-gray-600" />
                                    <FlowNode label="GATEWAY" active={activeFlow === 'sending' || activeFlow === 'streaming'} />
                                    <Icon name="arrow-right" size={14} className="text-gray-600" />
                                    <FlowNode label="LLM" active={activeFlow === 'streaming'} />
                                </div>
                            </div>

                            {/* Latency Chart */}
                            <div>
                                <h3 className="text-xs font-mono text-gray-500 mb-3">LATENCY (MS)</h3>
                                <div className="h-40 w-full bg-black/30 rounded-lg border border-border p-2">
                                    <ResponsiveContainer width="100%" height="100%">
                                        <LineChart data={metrics.latencyHistory}>
                                            <XAxis dataKey="time" hide />
                                            <YAxis width={40} fontSize={10} tick={{fill: '#71717a'}} axisLine={false} tickLine={false} />
                                            <Tooltip 
                                                contentStyle={{ background: '#18181b', border: '1px solid #27272a', borderRadius: '4px', fontSize: '12px' }}
                                                itemStyle={{ color: '#3b82f6' }}
                                            />
                                            <Line type="monotone" dataKey="ms" stroke="#3b82f6" strokeWidth={2} dot={false} isAnimationActive={false} />
                                        </LineChart>
                                    </ResponsiveContainer>
                                </div>
                            </div>

                            {/* Provider Health */}
                            <div>
                                <h3 className="text-xs font-mono text-gray-500 mb-3">PROVIDER HEALTH</h3>
                                <div className="space-y-2">
                                    {['Groq', 'Gemini', 'OpenAI', 'Anthropic'].map(p => (
                                        <div key={p} className="flex items-center justify-between p-2 rounded border border-border bg-black/20">
                                            <span className="text-xs font-mono text-gray-300">{p}</span>
                                            <div className="flex items-center gap-2">
                                                <span className="text-[10px] text-gray-500 font-mono">100% SLA</span>
                                                <div className="w-1.5 h-1.5 rounded-full bg-success shadow-[0_0_5px_#22c55e]"></div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </aside>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
