version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Infrastructure URLs updated for docker networking
      - DATABASE_URL=postgresql+asyncpg://gateway:gatewaypass@postgres:5432/gateway
      - REDIS_URL=redis://redis:6379/0
      # Pass through provider keys from the host environment
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=gateway
      - POSTGRES_PASSWORD=gatewaypass
      - POSTGRES_DB=gateway
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
